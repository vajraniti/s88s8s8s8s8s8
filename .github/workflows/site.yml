# builds the week's data (calendar, fred, gold) into docs/data.json and commits it.
# pages publishes docs/ from this branch (settings → pages → deploy from a branch, /docs).
# runs on every push, every ten minutes, and by hand from the actions tab.
name: site

on:
  push:
    branches: [sssss8s8s8]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit data.json
  pages: write      # ask pages to rebuild after that commit

# one run at a time, so two runs never race to commit data.json
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check
        if: github.event_name == 'push'
        run: |
          pip install --quiet pytest
          python -m pytest -q
      # when the calendar feed is unreachable nothing is written and the published week stays;
      # when fred or the gold chart is, the last published numbers are kept
      - name: build the week
        run: >-
          python scripts/build_data.py --out docs/data.json --soft
          --previous https://vajraniti.github.io/s88s8s8s8s8s8/data.json
      # generated_at moves on every run; a commit only when the week itself changed.
      # a commit pushed with this workflow's token does not start a pages build, so it is asked for.
      - name: publish the week
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/data.json; then
            echo "the week is unchanged"; exit 0
          fi
          week() { jq -S 'del(.generated_at)' "$@"; }
          if [ "$(git show HEAD:docs/data.json | week)" = "$(week docs/data.json)" ]; then
            echo "only the clock moved"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -q -m "data: the week as of $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=
          for wait in 5 10 20; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=1; break
            fi
            sleep "$wait"
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push docs/data.json to $GITHUB_REF_NAME"; exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

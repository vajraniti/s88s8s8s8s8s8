[project]
name = "hiranya"
version = "0.1.0"
description = "usd releases that move gold, one page"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "test_build_data"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
